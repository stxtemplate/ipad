  .top #clear:after{content:'🗑️';font-size:18px}
  .top #loadLatest{font-size:0;width:42px;padding:0}
  .top #loadLatest:after{content:'↻';font-size:21px}

  .body{height:calc(100dvh - 54px);min-height:0}

  .mobile-tools .tool span{font-size:9px;white-space:nowrap}
  .right{bottom:70px;max-height:calc(100dvh - 124px);padding:9px 10px max(12px,env(safe-area-inset-bottom));border-radius:14px 14px 0 0}

  .props-close{min-width:44px;min-height:42px}

function measureTextMetrics(it){

  const fontName=(it.font||'DB Helvethaica X').replace(/[\'\\]/g,'');

}

function getBarFontMetrics(ctx, fs, text){

      if(kind==='replaceOverlay'){const target=state.items.find(x=>x.id===state.selected && x.type==='overlay');if(target){snap();target.src=src;target.aspectRatio=w/h;target.cropZoom=1;target.cropX=0;target.cropY=0;state.selected=target.id;render();pending=null;return;}return;}

        // instead of adding a small second image above the design.
        const target=state.items.find(x=>x.id===state.selected && x.type==='image') || state.items.find(x=>x.type==='image');
        if(target){

        // No canvas processing, no background removal, no recoloring, no alpha edits.
        addFrom(kind,src,w,h);

function addFrom(type,src,nw,nh){

    const maxW=Math.min(300,state.w*0.35), maxH=Math.min(220,state.h*0.25);
    const s=Math.min(maxW/iw,maxH/ih,1);
    it.w=Math.max(40,Math.round(iw*s)); it.h=Math.max(40,Math.round(ih*s));
    it.x=Math.max(0,state.w-it.w-40); it.y=40;
  }else if(type==='overlay'){

    }else{
      // Safety fallback: replace the existing background instead of creating an overlay.

      if(target){target.src=src;target.zoom=1;target.x=0;target.y=0;target.w=state.w;target.h=state.h;state.selected=target.id;render();return;}
    }
  }
  state.items.push(it);
  state.selected=it.id;
  render();
}

function drawImage(ctx,it){return new Promise(res=>{const im=new Image();im.onload=()=>{const rot=(Number(it.rotation)||0)*Math.PI/180;const cx=it.x+it.w/2,cy=it.y+it.h/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.translate(-cx,-cy);if(it.type==='image' && Number(it.zoom)>1){const z=Number(it.zoom)||1;const s=Math.max(it.w/im.naturalWidth,it.h/im.naturalHeight)*z;const dw=im.naturalWidth*s,dh=im.naturalHeight*s;const dx=it.x+(it.w-dw)/2,dy=it.y+(it.h-dh)/2;ctx.save();ctx.beginPath();ctx.rect(it.x,it.y,it.w,it.h);ctx.clip();ctx.drawImage(im,dx,dy,dw,dh);ctx.restore();}else if(it.type==='overlay'){const shape=it.shape||'circle';ctx.save();ctx.beginPath();overlayShapePath(ctx,it);ctx.clip();const base=Math.max(it.w/im.naturalWidth,it.h/im.naturalHeight);const s=base*(Number(it.cropZoom)||1);const dw=im.naturalWidth*s,dh=im.naturalHeight*s;const dx=it.x+(it.w-dw)/2+(Number(it.cropX)||0)*it.w/100,dy=it.y+(it.h-dh)/2+(Number(it.cropY)||0)*it.h/100;ctx.drawImage(im,dx,dy,dw,dh);ctx.restore();const bw=Number(it.borderWidth)||0;if(bw>0){ctx.save();ctx.beginPath();overlayShapePath(ctx,it,bw/2);ctx.strokeStyle=it.borderColor||'#fff';ctx.lineWidth=bw;ctx.stroke();ctx.restore();}}else{ctx.drawImage(im,it.x,it.y,it.w,it.h)}ctx.restore();res()};im.src=it.src})}
function roundRectPath(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();}
function wrapLines(ctx,t,max){const out=[];for(const para of t.split('\\n')){let line='';for(const ch of para){const test=line+ch;if(ctx.measureText(test).width>max&&line){out.push(line);line=ch}else line=test}out.push(line)}return out}
function drawLines(ctx,lines,x,y,fs){lines.forEach((l,i)=>ctx.fillText(l,x,y+fs*(i+0.9)))}
function drawWrap(ctx,t,x,y,w,fs){drawLines(ctx,wrapLines(ctx,t,w),x,y,fs)}

// Mobile Properties toggle: the bottom button explicitly opens/closes the panel.
// Keep this handler independent of render()'s local isMobile variable.
function isMobileUI(){
  return window.matchMedia('(max-width:1100px)').matches || window.matchMedia('(pointer:coarse)').matches || window.matchMedia('(pointer:coarse)').matches || window.innerWidth<=1100;
}
function applyMobilePropsVisibility(){
  const right=document.querySelector('.right');
  if(!right)return;
  const open=!!propsOpen && isMobileUI();
  right.classList.toggle('props-open',open);
  if(isMobileUI()){
    right.style.display=open?'block':'none';
    right.style.visibility=open?'visible':'hidden';
    right.style.opacity=open?'1':'0';
  }else{
    right.style.display=''; right.style.visibility=''; right.style.opacity='';
  }
}
document.getElementById('mProps').onclick=(e)=>{
  e.preventDefault();
  e.stopPropagation();
  if(!state.selected){
    propsOpen=false;
    applyMobilePropsVisibility();
    alert('เลือกองค์ประกอบบน Canvas ก่อน');
    return;
  }
  propsOpen=!propsOpen;
  if(propsOpen) renderProps();
  applyMobilePropsVisibility();
};

function getBaseScale(){
  const stage=document.querySelector('.stage');
  const isMobile=window.matchMedia('(max-width:1100px)').matches || window.matchMedia('(pointer:coarse)').matches;
  const availableW=isMobile ? Math.max(220, stage.clientWidth-20) : Math.max(280, stage.clientWidth-50);
  const availableH=isMobile ? Math.max(220, stage.clientHeight-20) : Math.max(280, stage.clientHeight-50);
  const maxW=isMobile ? availableW : Math.min(availableW,900);
  const maxH=isMobile ? availableH : Math.min(availableH,760);
  return Math.max(0.05, Math.min(maxW/state.w,maxH/state.h,1));
}
function applyViewZoomStyles(){
  const stage=document.querySelector('.stage');
  const wrap=document.querySelector('.canvas-wrap');
  if(!wrap||!stage)return;
  const base=getBaseScale();
  const scale=base*viewZoom;
  const width=state.w*scale, height=state.h*scale;
  wrap.style.width=width+'px';
  wrap.style.height=height+'px';
  canvas.style.transformOrigin='top left';
  canvas.style.transform=`scale(${scale})`;
  // Keep the canvas centered while it fits. Once zoomed beyond the viewport,
  // place it in a real scrollable area so both horizontal and vertical panning
  // have physical scroll range instead of being clipped by the flex container.
  const pad=12;
  // Keep the design centered between the left/right panels while it fits.
  // Explicit left/right margins were previously adding extra space to the
  // flex item and visually pushing the canvas too far to the right.
  if(viewZoom <= 1.001){
    wrap.style.margin='auto';
  }else{
    const left=Math.max(pad, (stage.clientWidth-width)/2);
    const top=Math.max(pad, (stage.clientHeight-height)/2);
    wrap.style.marginLeft=left+'px';
    wrap.style.marginTop=top+'px';
    wrap.style.marginRight=pad+'px';
    wrap.style.marginBottom=pad+'px';
  }
  document.querySelector('.stage').classList.toggle('zoomed',viewZoom>1.001);
}
function setViewZoom(v, focusX=null, focusY=null, redraw=false){
  const stage=document.querySelector('.stage');
  const old=viewZoom;
  viewZoom=Math.max(1,Math.min(3,Number(v)||1));
  applyViewZoomStyles();
  if(focusX!=null && focusY!=null && old>0){
    const ratio=viewZoom/old;
    // Preserve the point between the two fingers while the scrollable canvas
    // grows. Coordinates are relative to the visible stage, so include the
    // current scroll offset.
    stage.scrollLeft=(stage.scrollLeft+focusX)*ratio-focusX;
    stage.scrollTop=(stage.scrollTop+focusY)*ratio-focusY;
    stage.scrollLeft=Math.max(0,stage.scrollLeft);
    stage.scrollTop=Math.max(0,stage.scrollTop);
  }
  if(redraw) render();
}

// Editor view zoom is intentionally controlled only by a two-finger pinch on mobile.
// One finger after zoom pans the editor when the finger is not on an object.
let pinchStartDist=0, pinchStartZoom=1, pinchCenterX=0, pinchCenterY=0, pinchActive=false;
let panActive=false, panId=null, panSX=0, panSY=0, panScrollX=0, panScrollY=0;
function touchDist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function touchCenter(a,b){return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
const stage=document.querySelector('.stage');
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1],c=touchCenter(a,b),r=stage.getBoundingClientRect();
    pinchStartDist=Math.max(1,touchDist(a,b));
    pinchStartZoom=viewZoom;
    pinchCenterX=c.x-r.left; pinchCenterY=c.y-r.top;
    pinchActive=true; panActive=false;
    e.preventDefault();
    return;
  }
  if(e.touches.length===1 && viewZoom>1.001){
    const t=e.touches[0];
    const item=t.target.closest && t.target.closest('.item');
    if(!item){
      panActive=true; panId=t.identifier; panSX=t.clientX; panSY=t.clientY;
      panScrollX=stage.scrollLeft; panScrollY=stage.scrollTop;
      e.preventDefault();
    }
  }
},{passive:false,capture:true});
stage.addEventListener('touchmove',e=>{
  if(pinchActive && e.touches.length>=2){
    e.preventDefault();
    const a=e.touches[0],b=e.touches[1],d=Math.max(1,touchDist(a,b));
    const z=pinchStartZoom*(d/pinchStartDist);
    const r=stage.getBoundingClientRect(),c=touchCenter(a,b);
    setViewZoom(z,c.x-r.left,c.y-r.top,false);
    return;
  }
  if(panActive && e.touches.length===1){
    const t=e.touches[0];
    if(t.identifier!==panId)return;
    e.preventDefault();
    stage.scrollLeft=panScrollX-(t.clientX-panSX);
    stage.scrollTop=panScrollY-(t.clientY-panSY);
  }
},{passive:false,capture:true});
const endTouch=()=>{if(pinchActive){pinchActive=false;applyViewZoomStyles();} panActive=false;panId=null;};
stage.addEventListener('touchend',endTouch,{passive:false,capture:true});
stage.addEventListener('touchcancel',endTouch,{passive:false,capture:true});

syncSizeSelect();
